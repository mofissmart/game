<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goose Park Arena</title>
    <style>
        body { margin: 0; overflow: hidden; background: #222; font-family: 'Courier New', monospace; user-select: none; }
        canvas { display: block; background: #2e3d30; } /* Dark turf green */
        #ui-layer { position: absolute; top: 15px; left: 15px; color: #00ff00; font-size: 18px; pointer-events: none; text-shadow: 2px 2px #000; }
        #menu-container { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(15, 15, 15, 0.95); padding: 30px; color: #fff; border: 2px solid #00ff00; border-radius: 4px; text-align: center; box-shadow: 0 0 20px rgba(0,255,0,0.3); }
        h1 { margin-top: 0; color: #00ff00; letter-spacing: 2px; }
        button { background: #111; color: #00ff00; border: 1px solid #00ff00; padding: 12px 24px; font-size: 14px; font-family: inherit; cursor: pointer; margin: 10px 0; width: 100%; transition: all 0.2s; }
        button:hover { background: #00ff00; color: #111; box-shadow: 0 0 10px #00ff00; }
        input { background: #222; color: #fff; border: 1px solid #555; padding: 10px; font-size: 16px; width: calc(100% - 24px); text-align: center; margin-bottom: 10px; font-family: inherit; }
        input:focus { border-color: #00ff00; outline: none; }
        .divider { margin: 15px 0; color: #555; font-size: 12px; }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div>SCORE: <span id="scoreBox">0</span></div>
        <div>PLAYERS: <span id="playerCountBox">1</span></div>
    </div>
    
    <div id="menu-container">
        <h1>GOOSE PARK ARENA</h1>
        <p style="font-size:12px; color:#888;">UNBLOCKED MULTIPLAYER v1.0</p>
        <button onclick="launchSoloMatch()">PLAY VS BOTS (SOLO)</button>
        <div class="divider">--- OR PARTY UP ---</div>
        <input type="text" id="partyCodeInput" maxlength="5" placeholder="ENTER PARTY CODE" oninput="this.value = this.value.toUpperCase()">
        <button onclick="launchPartyMatch()">JOIN / CREATE PARTY</button>
    </div>

    <canvas id="gameScreen"></canvas>

    <!-- Connect our external script libraries safely -->
    <script src="game.js"></script>
</body>
</html>
