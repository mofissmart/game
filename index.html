<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOOSE SHOT 3D .IO</title>
    <script src="https://cloudflare.com"></script>
    <script src="https://jsdelivr.net"></script>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; background: #0b0214; font-family: 'Arial Black', sans-serif; user-select: none; }
        canvas { display: block; width: 100%; height: 100%; }
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 16px; height: 16px; pointer-events: none; z-index: 5; }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: #00ffcc; }
        #crosshair::before { top: 7px; left: -8px; width: 32px; height: 2px; }
        #crosshair::after { top: -8px; left: 7px; width: 2px; height: 32px; }
        #hitmarker { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); width: 40px; height: 40px; pointer-events: none; z-index: 6; transition: transform 0.04s ease; }
        #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: none; box-sizing: border-box; }
        #stats { position: absolute; top: 25px; left: 25px; color: #ff33aa; font-size: 14px; text-shadow: 2px 2px #000; }
        .score-num { font-size: 36px; color: #fff; font-weight: bold; }
        #ammo-card { position: absolute; bottom: 30px; right: 40px; text-align: right; color: #fff; text-shadow: 2px 2px #000; }
        #weapon-txt { color: #00ffcc; font-size: 14px; letter-spacing: 1px; }
        #ammo-num { font-size: 55px; font-weight: bold; color: #fff; }
        #health-card { position: absolute; bottom: 30px; left: 40px; width: 250px; background: rgba(0,0,0,0.5); padding: 5px; border: 2px solid #222; }
        #health-bar { height: 15px; width: 100%; background: #00ff66; transition: width 0.1s; }
        #screen-flash { position: absolute; top:0; left:0; width:100%; height:100%; box-shadow: inset 0 0 100px rgba(255,0,0,0); transition: box-shadow 0.08s; pointer-events: none; z-index: 2; }
        #hint-banner { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); color: #fff; background: rgba(0,0,0,0.7); padding: 8px 20px; border-radius: 20px; font-size: 12px; pointer-events: none; display: none; text-align: center; }
        #lobby-menu { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: linear-gradient(135deg, #15002a 0%, #001133 100%); padding: 50px; border: 3px solid #ff33aa; text-align: center; box-shadow: 0 0 35px rgba(255,51,170,0.5); z-index: 10; color: #fff; border-radius: 8px; width: 350px; }
        #matchmaking-popup { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #0a0512; padding: 40px; border: 2px dashed #00ffcc; text-align: center; color: #00ffcc; border-radius: 8px; display: none; width: 330px; z-index: 10; }
        button { background: #ff33aa; color: #fff; border: none; padding: 18px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 15px; width: 100%; font-family: inherit; border-radius: 4px; box-shadow: 0 4px 0 #b3006b; }
        button:hover { background: #ff55bb; }
        .loader { display: inline-block; width: 35px; height: 35px; border: 4px solid rgba(0,255,204,0.2); border-radius: 50%; border-top-color: #00ffcc; animation: rotate 1s linear infinite; margin-bottom: 15px; }
        @keyframes rotate { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="screen-flash"></div>
    <div id="hint-banner">CLICK SCREEN TO RESUME LOCK — MOVE WITH WASD — SPACEBAR TO JUMP — KEYS 1-3 OR SCROLL TO SWAP GUNS</div>
    <div id="hud">
        <div id="crosshair"></div>
        <svg id="hitmarker" viewBox="0 0 100 100">
            <line x1="15" y1="15" x2="35" y2="35" stroke="#00ffcc" stroke-width="12"/>
            <line x1="85" y1="15" x2="65" y2="35" stroke="#00ffcc" stroke-width="12"/>
            <line x1="15" y1="85" x2="35" y2="65" stroke="#00ffcc" stroke-width="12"/>
            <line x1="85" y1="85" x2="65" y2="65" stroke="#00ffcc" stroke-width="12"/>
        </svg>
        <div id="stats">OPERATION: GOOSE SHOT<br>SCORE: <span id="scoreVal" class="score-num">0</span></div>
        <div id="health-card"><div id="health-bar"></div><div style="color:#fff; font-size:11px; margin-top:3px;">VITALS</div></div>
        <div id="ammo-card"><div id="weapon-txt">NAILGUN (1)</div><div><span id="ammo-num">∞</span></div></div>
    </div>
    <div id="lobby-menu">
        <h1 style="margin:0; font-size:44px; color:#00ffcc; text-shadow:3px 3px #ff33aa;">GOOSE SHOT</h1>
        <p style="font-size:11px; color:#aaa; margin:5px 0 25px 0; letter-spacing:1px;">3D AERIAL ARENA SHOOTER</p>
        <button onclick="triggerMatchmaker()">FIND ARENA MATCH</button>
    </div>
    <div id="matchmaking-popup">
        <div class="loader"></div><div style="font-size:18px; font-weight:bold;">SEARCHING FOR OPERATORS</div>
        <div id="mm-status" style="font-size:12px; color:#888; margin-top:10px; font-family:monospace;">PINGING LOCAL SERVERS...</div>
    </div>
    <script>
        let scene, camera, renderer, controls, weaponMesh;
        let gameRunning = false, score = 0, health = 100;
        const WEAPONS = [
            { name: "NAILGUN", fireRate: 110, ammo: Infinity, color: 0x7f8c8d, size: 0.03 },
            { name: "ROCKET LAUNCHER", fireRate: 800, ammo: 15, color: 0xe74c3c, size: 0.08 },
            { name: "RAILGUN", fireRate: 1150, ammo: 10, color: 0x3498db, size: 0.05 }
        ];
        let currentWeapon = 0, lastShotTime = 0;
        let moveF = false, moveB = false, moveL = false, moveR = false;
        let playerVelocity = new THREE.Vector3(), direction = new THREE.Vector3(), isGrounded = true, prevTime = performance.now();
        let activeProjectiles = [], botPlayers = [], pads = [];
        function triggerMatchmaker() {
            document.getElementById('lobby-menu').style.display = 'none';
            document.getElementById('matchmaking-popup').style.display = 'block';
            setTimeout(() => { document.getElementById('mm-status').innerText = "PEERS REGISTERED: 3/8... FETCHING ROOM KEYS"; }, 1000);
            setTimeout(() => { document.getElementById('mm-status').innerText = "ALLOCATING CLIENT PORT HANDSHAKES"; }, 2000);
            setTimeout(() => { launch3DArena(); }, 3200);
        }
        function launch3DArena() {
            document.getElementById('matchmaking-popup').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            document.getElementById('hint-banner').style.display = 'block';
            scene = new THREE.Scene(); scene.background = new THREE.Color(0x0a0314); scene.fog = new THREE.FogExp2(0x0a0314, 0.015);
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            controls = new THREE.PointerLockControls(camera, document.body); scene.add(controls.getObject());
            controls.getObject().position.set(0, 3, 0);
            document.addEventListener('click', () => { if(gameRunning) controls.lock(); });
            controls.addEventListener('lock', () => { document.getElementById('hint-banner').style.display = 'none'; });
            controls.addEventListener('unlock', () => { if(gameRunning) document.getElementById('hint-banner').style.display = 'block'; });
            scene.add(new THREE.AmbientLight(0xffffff, 0.9));
            let light = new THREE.DirectionalLight(0xff00ff, 0.6); light.position.set(10, 40, 10); scene.add(light);
            let gunData = WEAPONS[currentWeapon];
            weaponMesh = new THREE.Mesh(new THREE.BoxGeometry(gunData.size, gunData.size, gunData.size * 6), new THREE.MeshStandardMaterial({ color: gunData.color, roughness: 0.3 }));
            weaponMesh.position.set(0.2, -0.25, -0.4); camera.add(weaponMesh);
            buildArenaMap(); spawnHiddenBots(); setupControlsListeners();
            gameRunning = true; prevTime = performance.now(); animate();
        }
        function buildArenaMap() {
            let floor = new THREE.Mesh(new THREE.PlaneGeometry(250, 250), new THREE.MeshStandardMaterial({ color: 0x121622, roughness: 0.9 }));
            floor.rotation.x = -Math.PI / 2; scene.add(floor); scene.add(new THREE.GridHelper(250, 50, 0xff33aa, 0x223355));
            let padGeo = new THREE.CylinderGeometry(3.5, 3.5, 0.3, 16); let padMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
            [{x: 0, z: -35}, {x: -40, z: 20}, {x: 40, z: 15}].forEach(pos => {
                let pad = new THREE.Mesh(padGeo, padMat); pad.position.set(pos.x, 0.15, pos.z); scene.add(pad); pads.push(pad);
            });
        }
        function spawnHiddenBots() {
            let botGeo = new THREE.CapsuleGeometry(0.6, 1.6, 4, 8);
            for(let i=0; i<5; i++) {
                let rColor = [0x00ffcc, 0xff33aa, 0x33aaff, 0xffff33][Math.floor(Math.random()*4)];
                let bot = new THREE.Mesh(botGeo, new THREE.MeshStandardMaterial({ color: rColor }));
                resetBot(bot); scene.add(bot); botPlayers.push(bot);
            }
        }
        function resetBot(bot) { bot.position.set((Math.random()-0.5)*120, 1.3, (Math.random()-0.5)*120); bot.lastShot = 0; }
        function setupControlsListeners() {
            document.addEventListener('keydown', e => {
                if(!controls.isLocked) return;
                switch(e.code) {
                    case 'KeyW': moveF = true; break; case 'KeyS': moveB = true; break; case 'KeyA': moveL = true; break; case 'KeyD': moveR = true; break;
                    case 'Space': if(isGrounded) { playerVelocity.y += 18; isGrounded = false; } break;
                    case 'Digit1': currentWeapon = 0; updateGunMesh(); break; case 'Digit2': currentWeapon = 1; updateGunMesh(); break; case 'Digit3': currentWeapon = 2; updateGunMesh(); break;
                }
            });
            document.addEventListener('keyup', e => {
                switch(e.code) { case 'KeyW': moveF = false; break; case 'KeyS': moveB = false; break; case 'KeyA': moveL = false; break; case 'KeyD': moveR = false; break; }
            });
            document.addEventListener('wheel', e => {
                if(!controls.isLocked) return;
                currentWeapon = e.deltaY > 0 ? (currentWeapon + 1) % WEAPONS.length : (currentWeapon - 1 + WEAPONS.length) % WEAPONS.length;
                updateGunMesh();
            });
            document.addEventListener('mousedown', e => { if(controls.isLocked && e.button === 0) fireGun(); });
        }
        function updateGunMesh() {
            let data = WEAPONS[currentWeapon]; weaponMesh.geometry.dispose(); weaponMesh.geometry = new THREE.BoxGeometry(data.size, data.size, data.size * 6);
            weaponMesh.material.color.setHex(data.color); document.getElementById('weapon-txt').innerText = `${data.name} (${currentWeapon + 1})`;
            document.getElementById('ammo-num').innerText = data.ammo === Infinity ? "∞" : data.ammo;
        }
        function fireGun() {
            let gun = WEAPONS[currentWeapon]; let now = Date.now();
            if(now - lastShotTime < gun.fireRate || (gun.ammo !== Infinity && gun.ammo <= 0)) return;
            if(gun.ammo !== Infinity) { gun.ammo--; document.getElementById('ammo-num').innerText = gun.ammo; }
            lastShotTime = now; weaponMesh.position.z = -0.28; setTimeout(() => { weaponMesh.position.z = -0.4; }, 50);
            let dir = new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
            let b = new THREE.Mesh(new THREE.SphereGeometry(gun.name==="ROCKET LAUNCHER"?0.16:0.04, 4, 4), new THREE.MeshBasicMaterial({ color: 0xffffff }));
            b.position.copy(controls.getObject().position); b.v = dir.multiplyScalar(gun.name==="ROCKET LAUNCHER"?1.8:4.0); b.isRocket = (currentWeapon===1);
            scene.add(b); activeProjectiles.push(b);
        }
        function triggerHitmarker() {
            let el = document.getElementById('hitmarker'); el.style.transform = "translate(-50%, -50%) scale(1)";
            setTimeout(() => { el.style.transform = "translate(-50%, -50%) scale(0)"; }, 50);
        }
        function explosionBlast(pos) {
            let dist = controls.getObject().position.distanceTo(pos);
            if (dist < 8) { playerVelocity.y += (8 - dist) * 4.5; isGrounded = false; }
            botPlayers.forEach(bot => {
                if(bot.position.distanceTo(pos) < 9) { triggerHitmarker(); score += 50; document.getElementById('scoreVal').innerText = score; resetBot(bot); }
            });
        }
        function animate() {
            if (!gameRunning) return; requestAnimationFrame(animate); const time = performance.now(); const delta = (time - prevTime) / 1000;
            if(!isGrounded) playerVelocity.y -= 42 * delta;
            playerVelocity.x -= playerVelocity.x * 8.0 * delta; playerVelocity.z -= playerVelocity.z * 8.0 * delta;
            direction.z = Number(moveF) - Number(moveB); direction.x = Number(moveR) - Number(moveL); direction.normalize();
            let speed = isGrounded ? 180.0 : 60.0;
            if(moveF || moveB) playerVelocity.z -= direction.z * speed * delta; if(moveL || moveR) playerVelocity.x -= direction.x * speed * delta;
            controls.moveRight(-playerVelocity.x * delta); controls.moveForward(-playerVelocity.z * delta); controls.getObject().position.y += playerVelocity.y * delta;
            if (controls.getObject().position.y <= 2.0) { playerVelocity.y = 0; controls.getObject().position.y = 2.0; isGrounded = true; }
            pads.forEach(pad => {
                let planDist = Math.hypot(controls.getObject().position.x - pad.position.x, controls.getObject().position.z - pad.position.z);
                if(planDist < 3.5 && controls.getObject().position.y <= 2.3) { playerVelocity.y = 32; isGrounded = false; }
            });
            for(let i = activeProjectiles.length - 1; i >= 0; i--) {
                let b = activeProjectiles[i]; b.position.add(b.v); let remove = false;
                if(b.position.y <= 0.1 || Math.abs(b.position.x)>120 || Math.abs(b.position.z)>120) { if(b.isRocket) explosionBlast(b.position); remove = true; }
                if(!remove) {
                    for(let j = botPlayers.length - 1; j >= 0; j--) {
                        if(b.position.distanceTo(botPlayers[j].position) < 1.3) { if(b.isRocket) explosionBlast(b.position); else { triggerHitmarker(); score += 100; document.getElementById('scoreVal').innerText = score; resetBot(botPlayers[j]); } remove = true; break; }
                    }
                }
                if(remove) { scene.remove(b); activeProjectiles.splice(i, 1); }
            }
            botPlayers.forEach(bot => {
                let track = new THREE.Vector3().subVectors(controls.getObject().position, bot.position); track.y = 0; track.normalize(); bot.position.add(track.multiplyScalar(0.04));
            });
            renderer.render(scene, camera); prevTime = time;
        }
        window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
    </script>
</body>
</html>
