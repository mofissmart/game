<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOOSE PARK: MODERN ARENA</title>
    <style>
        body { margin: 0; overflow: hidden; background: #0b0c10; font-family: 'Arial Black', Gadget, sans-serif; user-select: none; }
        canvas { display: block; background: #1f2833; cursor: crosshair; }
        
        /* Tactical COD HUD Overlay */
        #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; box-sizing: border-box; }
        
        /* Top Left: Match Info */
        #match-info { position: absolute; top: 20px; left: 20px; color: #66fcf1; font-size: 14px; letter-spacing: 2px; text-shadow: 2px 2px #000; }
        .score-val { color: #fff; font-size: 24px; }

        /* Bottom Left: Health Bar */
        #health-container { position: absolute; bottom: 30px; left: 30px; width: 250px; background: rgba(0,0,0,0.6); border: 2px solid #1f2833; padding: 5px; border-radius: 3px; }
        #health-bar { height: 15px; width: 100%; background: #ff3333; transition: width 0.1s ease-out; }
        #health-text { color: #fff; font-size: 12px; margin-top: 3px; letter-spacing: 1px; }

        /* Bottom Right: Weapon & Ammo */
        #weapon-container { position: absolute; bottom: 30px; right: 30px; text-align: right; color: #fff; text-shadow: 2px 2px #000; }
        #weapon-name { font-size: 16px; color: #c5a059; letter-spacing: 1px; }
        #ammo-val { font-size: 45px; font-weight: bold; color: #66fcf1; }

        /* Center Crosshair / Hitmarker */
        #hitmarker { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); width: 30px; height: 30px; transition: transform 0.05s ease; opacity: 0.8; }
        
        /* Screen Damage Flash */
        #damage-flash { position: absolute; top:0; left:0; width:100%; height:100%; box-shadow: inset 0 0 100px rgba(255,0,0,0); transition: box-shadow 0.1s ease; pointer-events: none; }

        /* Main Menu */
        #menu-container { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(11, 12, 16, 0.95); padding: 40px; color: #fff; border-left: 5px solid #66fcf1; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.7); }
        h1 { margin: 0; font-size: 32px; letter-spacing: 4px; color: #fff; }
        h1 span { color: #66fcf1; }
        button { background: #1f2833; color: #fff; border: 1px solid #45f3ff; padding: 15px 30px; font-size: 14px; font-weight: bold; letter-spacing: 2px; cursor: pointer; margin: 15px 0; width: 100%; transition: all 0.2s; }
        button:hover { background: #66fcf1; color: #0b0c10; }
        input { background: #0b0c10; color: #fff; border: 1px solid #45f3ff; padding: 12px; font-size: 16px; width: calc(100% - 28px); text-align: center; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div id="damage-flash"></div>

    <div id="hud" style="display: none;">
        <div id="match-info">
            GOOSE PARK: TDM<br>
            SCORE: <span id="scoreBox" class="score-val">0</span>
        </div>
        
        <svg id="hitmarker" viewBox="0 0 100 100">
            <line x1="20" y1="20" x2="40" y2="40" stroke="#ff3333" stroke-width="8"/>
            <line x1="80" y1="20" x2="60" y2="40" stroke="#ff3333" stroke-width="8"/>
            <line x1="20" y1="80" x2="40" y2="60" stroke="#ff3333" stroke-width="8"/>
            <line x1="80" y1="80" x2="60" y2="60" stroke="#ff3333" stroke-width="8"/>
        </svg>

        <div id="health-container">
            <div id="health-bar"></div>
            <div id="health-text">HEALTH: 100%</div>
        </div>

        <div id="weapon-container">
            <div id="weapon-name">M4A1 TACTICAL</div>
            <div><span id="ammo-val">30</span><span style="color:#555; font-size:20px;"> / ∞</span></div>
        </div>
    </div>
    
    <div id="menu-container">
        <h1>GOOSE PARK<br><span>MODERN ARENA</span></h1>
        <p style="font-size:11px; color:#45f3ff; letter-spacing: 1px;">MULTIPLAYER DEPLOYMENT</p>
        <button onclick="launchSoloMatch()">DEPLOY SOLO (BOTS)</button>
        <input type="text" id="partyCodeInput" placeholder="ENTER TACTICAL PARTY CODE">
        <button onclick="launchPartyMatch()">CONNECT TO PARTY</button>
    </div>

    <canvas id="gameScreen"></canvas>

    <script src="game.js"></script>
</body>
</html>
