<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GOOSE SHOT 3D .IO</title>
    <!-- Load the official A-Frame 3D Engine and standard FPS physics modules -->
    <script src="https://aframe.io"></script>
    <script src="https://jsdelivr.net"></script>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; background: #000; font-family: sans-serif; user-select: none; }
        /* Arcade HUD Display */
        #hud { position: absolute; top: 20px; left: 20px; color: #ff33aa; font-size: 28px; font-weight: bold; pointer-events: none; z-index: 10; text-shadow: 2px 2px #000; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 14px; height: 14px; transform: translate(-50%, -50%); border: 2px solid #00ffcc; border-radius: 50%; pointer-events: none; z-index: 10; }
    </style>
</head>
<body>

    <div id="hud">SCORE: <span id="scoreVal">0</span> | WEAPON: ROCKET LAUNCHER</div>
    <div id="crosshair"></div>

    <!-- The 3D World Scene containing low-gravity arcade physics -->
    <a-scene physics="gravity: -35; debug: false">
        
        <!-- Cyber-Neon Sky and Lighting Ambient Environments -->
        <a-sky color="#0d041c"></a-sky>
        <a-ambient-light color="#444"></a-ambient-light>
        <a-directional-light color="#ff33aa" intensity="0.8" position="-10 30 10"></a-directional-light>
        <a-directional-light color="#00ffcc" intensity="0.5" position="10 20 -10"></a-directional-light>

        <!-- Dynamic First-Person Player Rig (Handles mouse looking, camera height, and WASD keys) -->
        
            
                <!-- 3D Rocket Launcher Mesh locked floating in front of your camera view -->
                <a-box id="weapon" color="#ff33aa" width="0.1" height="0.1" depth="0.7" position="0.25 -0.25 -0.5" roughness="0.2"></a-box>
            
        

        <!-- Massive Grid Map Combat Floor Arena -->
        <a-plane static-body color="#131722" width="200" height="200" rotation="-90 0 0" roughness="0.9"></a-plane>
        <a-grid color="#ff33aa" width="200" height="200"></a-grid>

        <!-- Winding Combat Obstacle Perimeter Structures (Concrete Cover Blocks) -->
        <a-box static-body color="#1c2333" width="15" height="6" depth="2" position="0 3 -20"></a-box>
        <a-box static-body color="#1c2333" width="2" height="6" depth="25" position="-20 3 -5"></a-box>
        <a-box static-body color="#1c2333" width="25" height="6" depth="2" position="20 3 15"></a-box>

        <!-- Yellow Aerial Jump-Pads (Launches player skyward when stepped onto) -->
        <a-cylinder id="pad1" color="#ffff00" radius="3.5" height="0.2" position="0 0.1 -10"></a-cylinder>
        <a-cylinder id="pad2" color="#ffff00" radius="3.5" height="0.2" position="-15 0.1 15"></a-cylinder>
        <a-cylinder id="pad3" color="#ffff00" radius="3.5" height="0.2" position="20 0.1 -5"></a-cylinder>

        <!-- Automated 3D Threat Nodes (Moving Target Capsules) -->
        

    </a-scene>

    <script>
        let score = 0;
        const playerEntity = document.getElementById('player');
        const weaponMesh = document.getElementById('weapon');
        const enemiesContainer = document.getElementById('enemies-container');
        const activeProjectilesList = [];
        const activeBotsList = [];

        // Spawn 3D bot targets across the map
        for (let i = 0; i < 5; i++) {
            let bot = document.createElement('a-capsule');
            bot.setAttribute('color', '#00ffcc');
            bot.setAttribute('radius', '0.6');
            bot.setAttribute('height', '1.6');
            resetBotPosition(bot);
            enemiesContainer.appendChild(bot);
            activeBotsList.push(bot);
        }

        function resetBotPosition(bot) {
            bot.setAttribute('position', {
                x: (Math.random() - 0.5) * 80,
                y: 0.8, // Half height anchor placement
                z: (Math.random() - 0.5) * 80 - 15
            });
        }

        // Fire Projectiles on mouse left-clicks
        window.addEventListener('mousedown', (e) => {
            if (e.button !== 0 || !document.pointerLockElement) return;

            // Weapon kick recoil animation values
            weaponMesh.setAttribute('position', '0.25 -0.25 -0.4');
            setTimeout(() => { weaponMesh.setAttribute('position', '0.25 -0.25 -0.5'); }, 60);

            // Compute exact direction vector out from camera lens tracking paths
            const cameraEl = document.getElementById('camera');
            const directionVector = new THREE.Vector3(0, 0, -1);
            directionVector.applyQuaternion(cameraEl.object3D.quaternion);

            // Spawn floating projectile tracing spheres directly into world memory space
            let ball = document.createElement('a-sphere');
            ball.setAttribute('color', '#ffff00');
            ball.setAttribute('radius', '0.15');
            
            let startPos = playerEntity.getAttribute('position');
            ball.setAttribute('position', { x: startPos.x, y: startPos.y, z: startPos.z });
            ball.velocity = directionVector.multiplyScalar(1.5); // Tracer travel velocity scale
            
            document.querySelector('a-scene').appendChild(ball);
            activeProjectilesList.push(ball);
        });

        // Main game ticker animation tracking loop processing frames
        function loop() {
            requestAnimationFrame(loop);

            let pPos = playerEntity.getAttribute('position');

            // 1. Check Jump-Pad Collisions (Launches you up smoothly if stepping over yellow discs)
            const padsList = [
                {x: 0, z: -10}, {x: -15, z: 15}, {x: 20, z: -5}
            ];
            padsList.forEach(pad => {
                let dist = Math.hypot(pPos.x - pad.x, pPos.z - pad.z);
                if (dist < 3.5 && pPos.y <= 0.2) {
                    // Inject structural kinematic lift force straight onto player tracking matrix
                    let currentVelocity = playerEntity.body.velocity;
                    playerEntity.body.velocity.set(currentVelocity.x, 26, currentVelocity.z);
                }
            });

            // 2. Animate and track active bullets trajectories
            for (let i = activeProjectilesList.length - 1; i >= 0; i--) {
                let b = activeProjectilesList[i];
                let bPos = b.getAttribute('position');

                b.setAttribute('position', {
                    x: bPos.x + b.velocity.x,
                    y: bPos.y + b.velocity.y,
                    z: bPos.z + b.velocity.z
                });

                let hitRegistered = false;

                // Check hit registry marks against active target loops
                activeBotsList.forEach(bot => {
                    let botPos = bot.getAttribute('position');
                    let targetDistance = Math.hypot(bPos.x - botPos.x, bPos.z - botPos.z);
                    
                    if (targetDistance < 1.4 && Math.abs(bPos.y - botPos.y) < 1.5) {
                        score += 100;
                        document.getElementById('scoreVal').innerText = score;
                        resetBotPosition(bot);
                        hitRegistered = true;
                    }
                });

                // Clear old distant bullets
                if (bPos.y < 0.1 || Math.abs(bPos.x) > 120 || Math.abs(bPos.z) > 120) {
                    // Rocket Jump logic check: If a missile hits near your feet, blast yourself skyward!
                    let splashDistance = Math.hypot(pPos.x - bPos.x, pPos.z - bPos.z);
                    if (splashDistance < 6 && bPos.y < 0.5) {
                        playerEntity.body.velocity.set(playerEntity.body.velocity.x, 22, playerEntity.body.velocity.z);
                    }
                    hitRegistered = true;
                }

                if (hitRegistered) {
                    b.parentNode.removeChild(b);
                    activeProjectilesList.splice(i, 1);
                }
            }

            // 3. Simple AI Tracking routines
            activeBotsList.forEach(bot => {
                let botPos = bot.getAttribute('position');
                let dx = pPos.x - botPos.x;
                let dz = pPos.z - botPos.z;
                let angle = Math.atan2(dz, dx);

                // Move bot smoothly closer to player position coordinates
                if (Math.hypot(dx, dz) > 4) {
                    bot.setAttribute('position', {
                        x: botPos.x + Math.cos(angle) * 0.04,
                        y: botPos.y,
                        z: botPos.z + Math.sin(angle) * 0.04
                    });
                }
            });
        }

        // Delay engine initialization checking frames until component mounting updates complete
        document.querySelector('a-scene').addEventListener('loaded', () => {
            setTimeout(() => { loop(); }, 500);
        });
    </script>
</body>
</html>
