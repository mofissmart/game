<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOOSESHOT.IO - AERIAL ARENA FPS</title>
    <!-- Core 3D engine framework and native look controls addon libraries -->
    <script src="https://cloudflare.com"></script>
    <script src="https://jsdelivr.net"></script>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; background: #07020d; font-family: 'Arial Black', sans-serif; user-select: none; }
        canvas { display: block; width: 100%; height: 100%; }
        
        /* Tactical Crosshair */
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 16px; height: 16px; pointer-events: none; z-index: 5; }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: #00ffcc; }
        #crosshair::before { top: 7px; left: -8px; width: 32px; height: 2px; }
        #crosshair::after { top: -8px; left: 7px; width: 2px; height: 32px; }

        #hitmarker { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); width: 44px; height: 44px; pointer-events: none; z-index: 6; transition: transform 0.04s ease; }

        /* HUD Structure */
        #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: none; box-sizing: border-box; }
        #match-meta { position: absolute; top: 25px; left: 25px; color: #ff33aa; font-size: 13px; letter-spacing: 2px; text-shadow: 2px 2px #000; line-height: 1.6; }
        .score-banner { font-size: 36px; color: #fff; font-weight: bold; }
        
        #ammo-card { position: absolute; bottom: 30px; right: 40px; text-align: right; color: #fff; text-shadow: 2px 2px #000; }
        #weapon-lbl { color: #00ffcc; font-size: 13px; letter-spacing: 1px; }
        #ammo-num { font-size: 55px; font-weight: bold; color: #fff; }

        #health-container { position: absolute; bottom: 30px; left: 40px; width: 250px; background: rgba(0,0,0,0.5); padding: 5px; border: 2px solid #222; border-radius: 4px; }
        #health-fill { height: 15px; width: 100%; background: #00ff66; transition: width 0.1s; }

        #damage-flash { position: absolute; top:0; left:0; width:100%; height:100%; box-shadow: inset 0 0 100px rgba(255,0,0,0); transition: box-shadow 0.08s; pointer-events: none; z-index: 2; }
        #hint-banner { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); color: #fff; background: rgba(0,0,0,0.7); padding: 8px 20px; border-radius: 20px; font-size: 11px; pointer-events: none; display: none; text-align: center; letter-spacing: 1px; }

        /* Main Menu panels */
        #lobby-menu { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: linear-gradient(135deg, #1f0326 0%, #031b33 100%); padding: 50px; border: 3px solid #ff33aa; text-align: center; box-shadow: 0 0 40px rgba(255,51,170,0.5); z-index: 10; color: #fff; border-radius: 8px; width: 360px; }
        #matchmaking-screen { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #07030f; padding: 40px; border: 2px dashed #00ffcc; text-align: center; color: #00ffcc; border-radius: 8px; display: none; width: 330px; z-index: 10; box-shadow: 0 0 25px rgba(0,255,204,0.3); }
        button { background: #ff33aa; color: #fff; border: none; padding: 18px; font-size: 15px; font-weight: bold; letter-spacing: 2px; cursor: pointer; margin-top: 15px; width: 100%; font-family: inherit; border-radius: 4px; box-shadow: 0 4px 0 #b3006b; transition: all 0.1s; }
        button:hover { background: #ff55bb; transform: translateY(-1px); }
        button:active { transform: translateY(1px); box-shadow: none; }
        .invite-notice { margin-top: 20px; background: rgba(255,255,255,0.04); padding: 12px; border-radius: 4px; font-size: 12px; color: #999; border: 1px dashed #333; }
        .loader-ring { display: inline-block; width: 35px; height: 35px; border: 4px solid rgba(0,255,204,0.2); border-radius: 50%; border-top-color: #00ffcc; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="damage-flash"></div>
    <div id="hint-banner">CLICK SCREEN TO RESUME COMBAT — WASD TO MOVE — SPACEBAR TO AIR JUMP — WHEEL OR KEYS 1-3 TO SWAP WEAPONS</div>

    <!-- HUD Layer -->
    <div id="hud">
        <div id="crosshair"></div>
        <svg id="hitmarker" viewBox="0 0 100 100">
            <line x1="15" y1="15" x2="35" y2="35" stroke="#00ffcc" stroke-width="12"/>
            <line x1="85" y1="15" x2="65" y2="35" stroke="#00ffcc" stroke-width="12"/>
            <line x1="15" y1="85" x2="35" y2="65" stroke="#00ffcc" stroke-width="12"/>
            <line x1="85" y1="85" x2="65" y2="65" stroke="#00ffcc" stroke-width="12"/>
        </svg>
        <div id="match-meta">GOOSESHOT.IO Arena<br>SCORE: <span id="scoreVal" class="score-banner">0</span></div>
        <div id="health-container"><div id="health-fill"></div></div>
        <div id="ammo-card"><div id="weapon-lbl">EGG-LAUNCHER (1)</div><div><span id="ammo-num">∞</span></div></div>
    </div>

    <!-- Menu Panels -->
    <div id="lobby-menu">
        <h1>GOOSE SHOT</h1>
        <p style="font-size:11px; color:#aaa; margin:5px 0 25px 0; letter-spacing:1px;">AERIAL GOOSE ARENA FPS</p>
        <button onclick="startMatchmakingQueue()">DEPLOY IN ARENA</button>
        <div class="invite-notice">🪶 Challenge your flock! Share your custom page link to invite others.</div>
    </div>

    <div id="matchmaking-screen">
        <div class="loader-ring"></div>
        <div style="font-size:18px; font-weight:bold; letter-spacing:1px;">GATHERING FLOCK</div>
        <div id="queue-status" style="font-size:12px; color:#777; margin-top:10px; font-family:monospace;">PINGING MATCH TICKETS...</div>
    </div>

    <!-- Sequential execution pipelines loading step-by-step -->
    <script src="goose_matchmaker.js"></script>
    <script src="goose_engine.js"></script>
</body>
</html>
