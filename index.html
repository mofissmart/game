<!DOCTYPE html>
<html>
<head>
    <title>GOOSE SHOT 3D</title>
    <style>
        body, html { margin:0; padding:0; overflow:hidden; width:100%; height:100%; background:#0a0314; font-family:sans-serif; user-select:none; }
        canvas { display:block; width:100%; height:100%; background:#0c0214; }
        #hud { position:absolute; top:20px; left:20px; color:#ff33aa; font-size:24px; pointer-events:none; display:none; font-weight:bold; }
        #cross { position:absolute; top:50%; left:50%; width:10px; height:10px; background:#00ffcc; transform:translate(-50%,-50%); border-radius:50%; pointer-events:none; display:none; }
        #menu { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:#13141f; padding:40px; border:3px solid #ff33aa; text-align:center; color:#fff; border-radius:8px; width:280px; }
        button { background:#ff33aa; color:#fff; border:none; padding:15px; font-size:16px; font-weight:bold; cursor:pointer; width:100%; margin-top:20px; }
    </style>
</head>
<body>
    <div id="hud">SCORE: <span id="score">0</span> | GUN: <span id="gun">NAILGUN</span></div>
    <div id="cross"></div>
    <div id="menu">
        <h1>GOOSE SHOT 3D</h1>
        <p style="color:#00ffcc; font-size:12px;">3D AERIAL ARENA</p>
        <button onclick="start()">PLAY MATCH</button>
    </div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let active = false, score = 0, weapon = 0;
        let player = { x:0, y:2, z:0, yaw:0, pitch:0, vY:0 }, move = { w:0, s:0, a:0, d:0 }, grounded = true;
        let targets = [], pads = [], bullets = [], lastShot = 0;
        const GUNS = [{n:"NAILGUN",r:120},{n:"ROCKET LAUNCHER",r:800},{n:"RAILGUN",r:1150}];
        const GEESE = ["Guard Goose", "Mallard Mercenary", "Canada Commando"];

        function start() {
            document.getElementById('menu').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            document.getElementById('cross').style.display = 'block';
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            pads = [{x:0, z:-25}, {x:-30, z:20}, {x:30, z:15}];
            for(let i=0; i<5; i++) {
                targets.push({ x:(Math.random()-0.5)*80, y:1.5, z:(Math.random()-0.5)*80-30, r:1.3, n:GEESE[i%3], c:["#ffffff","#4a5357","#6e503b"][i%3] });
            }
            window.addEventListener('keydown', e => handleKeys(e, 1));
            window.addEventListener('keyup', e => handleKeys(e, 0));
            window.addEventListener('mousemove', e => {
                if(!active) return;
                player.yaw -= (e.movementX || 0) * 0.003; player.pitch -= (e.movementY || 0) * 0.003;
                player.pitch = Math.max(-1.4, Math.min(1.4, player.pitch));
            });
            canvas.addEventListener('click', () => canvas.requestPointerLock());
            window.addEventListener('mousedown', e => { if(active && e.button===0) shoot(); });
            active = true; loop();
        }

        function handleKeys(e, s) {
            let k = e.key.toLowerCase();
            if(k==='w') move.w=s; if(k==='s') move.s=s; if(k==='a') move.l=s; if(k==='d') move.r=s;
            if(s===1) {
                if(e.code==='Space' && grounded) { player.vY = 16; grounded = false; }
                if(k==='1') { weapon=0; updateHUD(); } if(k==='2') { weapon=1; updateHUD(); } if(k==='3') { weapon=2; updateHUD(); }
            }
        }
        function updateHUD() { document.getElementById('gun').innerText = GUNS[weapon].n; }

        function shoot() {
            let now = Date.now(); if(now - lastShot < GUNS[weapon].r) return; lastShot = now;
            let cP = Math.cos(player.pitch), sP = Math.sin(player.pitch), cY = Math.cos(player.yaw), sY = Math.sin(player.yaw);
            bullets.push({ x:player.x, y:player.y, z:player.z, dx:-sY*cP*2.5, dy:sP*2.5, dz:-cY*cP*2.5, isRocket:(weapon===1) });
        }

        function explode(pos) {
            if(Math.hypot(player.x-pos.x, player.z-pos.z) < 8.5) { player.vY += 15; grounded = false; }
            targets.forEach(t => { if(Math.hypot(t.x-pos.x, t.z-pos.z) < 8.5) { score+=50; t.x=(Math.random()-0.5)*80; t.z=(Math.random()-0.5)*80; } });
        }

        function project(x, y, z) {
            let cx = x-player.x, cy = y-player.y, cz = z-player.z;
            let cY = Math.cos(-player.yaw), sY = Math.sin(-player.yaw), cP = Math.cos(-player.pitch), sP = Math.sin(-player.pitch);
            let rx = cx*cY - cz*sY, rz = cx*sY + cz*cY, ry = cy*cP - rz*sP, tZ = cy*sP + rz*cP;
            if (tZ <= 0.2) return null;
            let s = (canvas.width/2) / (tZ * Math.tan(75 * Math.PI/360));
            return { x:(canvas.width/2)+rx*s, y:(canvas.height/2)-ry*s, size:(1/tZ)*s };
        }

        function loop() {
            if(!active) return;
            ctx.fillStyle = "#0a0314"; ctx.fillRect(0,0,canvas.width,canvas.height);
            if(!grounded) player.vY -= 35 * 0.016; player.y += player.vY * 0.016;
            if(player.y <= 2) { player.y = 2; player.vY = 0; grounded = true; }
            let sY = Math.sin(player.yaw), cY = Math.cos(player.yaw);
            if(move.w) { player.x -= sY*0.16; player.z -= cY*0.16; } if(move.s) { player.x += sY*0.16; player.z += cY*0.16; }
            if(move.a) { player.x -= cY*0.16; player.z += sY*0.16; } if(move.d) { player.x += cY*0.16; player.z -= sY*0.16; }

            pads.forEach(pad => {
                if(Math.hypot(player.x-pad.x, player.z-pad.z) < 3.5 && player.y <= 2.2) { player.vY = 29; grounded = false; }
                let sPos = project(pad.x, 0, pad.z);
                if(sPos) { ctx.beginPath(); ctx.arc(sPos.x, sPos.y, sPos.size*2.5, 0, Math.PI*2); ctx.fillStyle = "#ffff00"; ctx.fill(); }
            });

            targets.forEach(t => {
                let dX = player.x-t.x, dZ = player.z-t.z, angle = Math.atan2(dZ, dX);
                t.x += Math.cos(angle)*0.03; t.z += Math.sin(angle)*0.03;
                let sPos = project(t.x, t.y, t.z);
                if(sPos) {
                    ctx.beginPath(); ctx.arc(sPos.x, sPos.y, sPos.size*t.r, 0, Math.PI*2); ctx.fillStyle = t.c; ctx.fill();
                    ctx.beginPath(); ctx.arc(sPos.x+(sPos.size*0.4), sPos.y, sPos.size*0.3, 0, Math.PI*2); ctx.fillStyle = "#ff6600"; ctx.fill();
                    ctx.fillStyle = "#fff"; ctx.font = `${Math.max(10, sPos.size*0.4)}px sans-serif`; ctx.textAlign = "center";
                    ctx.fillText(t.n, sPos.x, sPos.y - (sPos.size*t.r) - 10);
                }
            });

            for(let i=bullets.length-1; i>=0; i--) {
                let b = bullets[i]; b.x += b.dx; b.y += b.dy; b.z += b.dz; let hit = false;
                if(b.y <= 0.1 || Math.hypot(b.x, b.z) > 150) { if(b.isRocket) explode(b); hit = true; }
                targets.forEach(t => { if(Math.hypot(b.x-t.x, b.z-t.z)<1.8 && Math.abs(b.y-t.y)<1.8) { if(b.isRocket) explode(b); else { score+=100; t.x=(Math.random()-0.5)*80; t.z=(Math.random()-0.5)*80; } hit = true; } });
                let sPos = project(b.x, b.y, b.z); if(sPos && !hit) { ctx.beginPath(); ctx.arc(sPos.x, sPos.y, sPos.size*0.15, 0, Math.PI*2); ctx.fillStyle = "#fff"; ctx.fill(); }
                if(hit) bullets.splice(i, 1);
            }
            ctx.fillStyle = "#ff33aa"; ctx.fillRect(canvas.width * 0.7, canvas.height * 0.7, 70, 140);
            document.getElementById('score').innerText = score;
            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
